spring.application.name=API-GATEWAY
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost

spring.cloud.gateway.server.webflux.routes[0].id=school-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://SCHOOL-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/school/**

spring.cloud.gateway.server.webflux.routes[1].id=student-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://STUDENT-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/student/**